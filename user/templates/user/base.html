<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" http-equiv="Cache-Control" content="max-age=600">
    <title>{% block title %}CRM{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
        {% if request.user.is_authenticated %}
        <a class="navbar-brand" href="{% url 'user:home' %}">Домашняя страница</a>
        <a class="navbar-brand" href="{% url 'user:client_list' %}">Клиенты</a>
        <a class="navbar-brand" href="{% url 'user:message_list' %}">Сообщения</a>
        <a class="navbar-brand" href="{% url 'user:mailing_list' %}">Рассылки</a>
        {% endif %}
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user:client_create' %}">Добавить клиента</a>
                </li>
                {% if request.user.is_authenticated %}
                <form method="post" action="{% url 'user:logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link" style="display: inline; padding: 0;">Выйти
                    </button>
                </form>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user:login' %}">Войти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user:register' %}">Регистрация</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
