{% extends 'user/base.html' %}
{% block title %}Форма клиента{% endblock %}

{% block content %}
<h2>{{ view.object.pk|yesno:"Редактировать клиента,Добавить клиента" }}</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'user:client_list' %}" class="btn btn-secondary">Назад</a>
</form>
{% endblock %}
