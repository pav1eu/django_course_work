{% extends 'user/base.html' %}
{% block title %}Удаление клиента{% endblock %}

{% block content %}
<h2>Удалить клиента</h2>
<p>Вы уверены, что хотите удалить клиента <strong>{{ object.full_name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'user:client_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
