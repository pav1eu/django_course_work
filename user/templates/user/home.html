{% extends 'user/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Добро пожаловать!</h1>
    <div class="row text-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Всего рассылок</h5>
                    <p class="display-5">{{ total_mailings }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Активных рассылок</h5>
                    <p class="display-5">{{ active_mailings }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Уникальных клиентов</h5>
                    <p class="display-5">{{ unique_clients }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
